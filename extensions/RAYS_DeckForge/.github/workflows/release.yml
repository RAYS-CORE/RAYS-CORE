name: Release Tauri App

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            servers/nextjs/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: servers/nextjs
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV and Python dependencies
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build Python backend binary
        shell: bash
        run: |
          cd servers/fastapi
          uv venv
          source .venv/bin/activate || source .venv/Scripts/activate
          uv pip install pyinstaller
          uv pip install -e .
          pyinstaller server.spec

      - name: Setup Tauri sidecar binary
        shell: bash
        run: |
          # Get the Rust target triple dynamically
          TARGET_TRIPLE=$(rustc -Vv | grep host | cut -f2 -d' ')
          echo "Detected target triple: $TARGET_TRIPLE"

          mkdir -p src-tauri/binaries

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp servers/fastapi/dist/fastapi.exe src-tauri/binaries/fastapi-$TARGET_TRIPLE.exe
          else
            cp servers/fastapi/dist/fastapi src-tauri/binaries/fastapi-$TARGET_TRIPLE
            chmod +x src-tauri/binaries/fastapi-$TARGET_TRIPLE
          fi

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Frontend
        run: npm run build:nextjs:tauri

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RAYS DeckForge ${{ github.ref_name }}"
          releaseBody: "Automated release of RAYS DeckForge standalone desktop app."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
